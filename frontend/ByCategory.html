<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartSort Solutions - Waste by Category</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="Untitled-1.js"></script> 
</head>
<body>
    <div class="container" style="padding: 20px;">
        <h1 style="margin-top: 0; color: #4CAF50;">Waste Breakdown by Category</h1>

        <div class="description" style="margin-bottom: 20px; font-size: 16px; opacity: 0.8;">
            Here's the current real-time breakdown of metric inventory yields collected by material type:
        </div>

        <div class="waste-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px;">
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Biodegradable Waste</h3>
                <div class="stat-value" id="organicWaste" style="font-size: 28px; font-weight: bold;">67</div>
            </div>
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Plastic Waste</h3>
                <div class="stat-value" id="plasticWaste" style="font-size: 28px; font-weight: bold;">33</div>
            </div>
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Metal Waste</h3>
                <div class="stat-value" id="metalWaste" style="font-size: 28px; font-weight: bold;">30</div>
            </div>
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Glass Waste</h3>
                <div class="stat-value" id="glassWaste" style="font-size: 28px; font-weight: bold;">10</div>
            </div>
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Paper Waste</h3>
                <div class="stat-value" id="biomedicalWaste" style="font-size: 28px; font-weight: bold;">50</div>
            </div>
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Cardboard Waste</h3>
                <div class="stat-value" id="ewaste" style="font-size: 28px; font-weight: bold;">10</div>
            </div>
        </div>
    </div>
</body>
</html>
