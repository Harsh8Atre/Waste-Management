<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartSort Solutions - Area Wise Waste</title>
    <script defer src="Untitled-1.js"></script>
</head>
<body>
    <div class="container" style="padding: 20px;">
        <h1 style="margin-top: 0; color: #4CAF50;">Area Wise Waste Distribution</h1>
        
        <div class="waste-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-top: 20px;">
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Rau</h3>
                <div class="stat-value" style="font-size: 24px; font-weight: bold;">40 tons</div>
            </div>
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Rajendra Nagar</h3>
                <div class="stat-value" style="font-size: 24px; font-weight: bold;">60 tons</div>
            </div>
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Bhavarkuan</h3>
                <div class="stat-value" style="font-size: 24px; font-weight: bold;">80 tons</div>
            </div>
            <div class="stat-card" style="background-color: rgba(255,255,255,0.05); padding: 20px; border-radius: 10px; border-left: 4px solid #4CAF50;">
                <h3 style="margin: 0 0 10px 0;">Mhow</h3>
                <div class="stat-value" style="font-size: 24px; font-weight: bold;">120 tons</div>
            </div>
        </div>
    </div>
</body>
</html>
