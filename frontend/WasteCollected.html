<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartSort Solutions - Waste Collected</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Kept your script reference intact for metrics computing if needed -->
    <script src="Untitled-1.js"></script>
</head>
<body>
    <div class="container" style="padding: 20px;">
        <h1 style="margin-top: 0; color: #4CAF50;">Waste Breakdown by Category</h1>

        <div class="description" style="font-size: 16px; margin-bottom: 20px; opacity: 0.9;">
            Here's the current breakdown of collected waste by type:
        </div>

        <div class="waste-stats" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px;">
            <div class="stat-card" style="background-color: rgba(255,255,255,0.03); padding: 25px; border-radius: 10px; border-left: 4px solid #4CAF50; text-align: center;">
                <h3 style="margin: 0 0 10px 0; font-size: 18px; opacity: 0.8;">Total Waste Collected</h3>
                <div class="stat-value" style="font-size: 32px; font-weight: bold; color: #4CAF50;">200 tons</div>
            </div>
        </div>
    </div>
</body>
</html>
