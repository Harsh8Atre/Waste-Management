<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SmartSort Solutions - Sign In</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script defer src="Signin.js"></script>
</head>
<body>
    <div class="container" style="padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 70vh;">
        <div class="signin-container" style="background-color: rgba(255,255,255,0.03); padding: 30px; border-radius: 10px; width: 100%; max-width: 400px; border-top: 4px solid #4CAF50; text-align: center;">
            <h2 style="margin-top: 0; color: #4CAF50; margin-bottom: 20px;">Team Portal Sign In</h2>
            <form id="signinForm" style="display: flex; flex-direction: column; gap: 15px;">
                <input type="email" id="email" placeholder="Enter your operational email" required 
                       style="padding: 12px; border-radius: 5px; border: 1px solid rgba(255,255,255,0.1); background-color: rgba(0,0,0,0.2); color: white; font-size: 14px;">
                <button type="submit" 
                        style="padding: 12px; border-radius: 5px; border: none; background-color: #4CAF50; color: white; font-weight: bold; font-size: 16px; cursor: pointer;">
                    Sign In
                </button>
            </form>
        </div>
    </div>
</body>
</html>
